*{box-sizing:border-box}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;background:var(--paper);border-radius:22px;padding:18px 20px;text-decoration:none;color:inherit;box-shadow:0 6px 0 var(--deep);transition:transform .15s}
a.card:hover{transform:translateY(-4px)}
a.card:focus-visible{outline:4px solid #ffc23d;outline-offset:3px}
.tag{display:inline-block;background:var(--sand);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.card h3{font-family:var(--display);font-weight:400;font-size:26px;margin:8px 0 4px;color:var(--cross)}
.card p{margin:0;color:var(--soft);font-size:15px}
.go{margin-top:12px;font-weight:700;color:var(--deep)}
footer{margin-top:36px;color:#d9f3fb;font-size:14px}
