.wrap{max-width:1000px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,52px);color:#fff;margin:0;text-shadow:0 3px 0 var(--deep);letter-spacing:.05em}
header p{margin:4px 0 0;color:#d9f3fb}
.qr{background:#fff;border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 var(--deep);font-weight:700;font-size:16px}
.qr svg{width:80px;height:80px}
h2{font-family:var(--display);font-weight:400;color:#fff;font-size:26px;margin:32px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;background:var(--paper);border-radius:22px;padding:18px 20px;text-decoration:none;color:inherit;box-shadow:0 6px 0 var(--deep);transition:transform .15s}
.card .thumb{display:block;width:calc(100% + 40px);max-width:none;margin:-18px -20px 12px;aspect-ratio:16/9;object-fit:cover;object-position:50% 88%;border-radius:22px 22px 0 0}
a.card:hover{transform:translateY(-4px)}
a.card:focus-visible{outline:4px solid #ffc23d;outline-offset:3px}
.tag{display:inline-block;background:var(--sand);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.card h3{font-family:var(--display);font-weight:400;font-size:26px;margin:8px 0 4px;color:var(--cross)}
.card p{margin:0;color:var(--soft);font-size:17px}
.go{margin-top:12px;font-weight:700;color:var(--deep)}
footer{margin-top:36px;color:#d9f3fb;font-size:16px}
</style>
</head>
