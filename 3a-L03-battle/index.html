/* Layout: one landscape screen split into two team halves (red | blue). Each half: mission card, patient zone, item tray. Built for a classroom touch TV. */
:root{
  --sea:#2a9fc4; --sea-deep:#16708f; --foam:#d9f3fb;
  --red:#e4453a; --red-deep:#b52f26; --red-soft:#fde3df;
  --blue:#2f7fd6; --blue-deep:#1f5ea6; --blue-soft:#dfeeff;
  --sun:#ffc23d; --paper:#fffaf0; --card:#ffffff; --ink:#16323f; --soft:#4b6672;
  --skin:#f2c7a0; --skin-dark:#d9a27a; --ok:#2f9e57;
  --font:"BpmfHuninnPage","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--font);font-size:18px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;
  padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));padding-block:6px 8px}
.bar{display:flex;align-items:center;gap:12px;padding:2px 4px 6px;color:#fff}
.bar h1{margin:0;font-weight:400;font-size:26px;letter-spacing:.04em;text-shadow:0 2px 0 var(--sea-deep);white-space:nowrap}
.bar .clock{margin-left:auto;background:var(--paper);color:var(--ink);border-radius:999px;padding:2px 14px;font-size:22px;font-variant-numeric:tabular-nums}
.bar button{border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:17px;box-shadow:0 3px 0 var(--sea-deep)}

.arena{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team{position:relative;min-width:0;min-height:0;border-radius:20px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;border:5px solid var(--tc)}
.team.red{--tc:var(--red);--tcd:var(--red-deep);--tcs:var(--red-soft)}
.team.blue{--tc:var(--blue);--tcd:var(--blue-deep);--tcs:var(--blue-soft)}
.thead{background:var(--tc);color:#fff;display:flex;align-items:center;gap:10px;padding:4px 12px 6px}
.thead .nm{font-size:24px}
.thead .prog{margin-left:auto;display:flex;gap:5px}
.thead .prog i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
.thead .prog i.done{background:var(--sun);box-shadow:0 0 0 2px #fff inset}
.thead .prog i.now{background:#fff}
.thead .miss{font-size:15px;background:rgba(0,0,0,.18);border-radius:999px;padding:1px 10px;font-variant-numeric:tabular-nums}

.mission{padding:6px 12px 4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--tcs)}
.mission .mt{font-size:21px;color:var(--tcd)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{min-width:44px;height:44px;padding:0 8px;border-radius:12px;background:#fff;border:3px solid #e3d6ba;display:grid;place-items:center;font-size:22px;color:var(--soft)}
.step.now{border-color:var(--tc);color:var(--ink);background:#fff8dc;animation:bob 1s ease-in-out infinite}
.step.done{background:var(--ok);border-color:var(--ok);color:#fff}
@keyframes bob{50%{transform:translateY(-3px)}}
.hint{width:100%;font-size:16px;color:var(--soft);min-height:1.2em}

.patient{position:relative;flex:1;min-height:150px;margin:8px 10px 6px;border-radius:18px;background:radial-gradient(ellipse at 50% 60%, #fff 0%, #f6ecd8 100%);border:3px dashed #d8c7a2;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .2s}
.patient.hot{border-style:solid;border-color:var(--tc);background:radial-gradient(ellipse at 50% 60%, #fff 0%, var(--tcs) 100%)}
.patient svg.body{width:min(85%,440px);height:auto;max-height:92%}
.stickers{position:absolute;inset:0;pointer-events:none}
.stickers span{position:absolute;font-size:40px;line-height:1;animation:pop .45s backwards;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.stickers span svg{width:46px;height:46px;display:block}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.ring{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px;font-size:18px;white-space:nowrap}
.ring b{color:var(--sun);font-weight:400}
.rubbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--sun);border-radius:999px;padding:4px 16px;font-size:19px;white-space:nowrap;animation:bob 1s infinite}
.plabel{position:absolute;left:12px;bottom:8px;font-size:15px;color:var(--soft);background:rgba(255,255,255,.8);border-radius:8px;padding:0 8px}

.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;padding:6px 10px 10px}
.tok{border:3px solid #e3d6ba;background:#fff;border-radius:16px;min-height:88px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;box-shadow:0 3px 0 #e3d6ba}
.tok .ic{font-size:38px;line-height:1;height:42px;display:grid;place-items:center}
.tok .ic svg{width:42px;height:42px}
.tok .lb{font-size:15px;line-height:1.25;text-align:center}
.tok.used{visibility:hidden}
.tok.big .ic{font-size:30px;font-weight:700;color:var(--red)}
.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.95;margin:0}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.freeze{position:absolute;inset:0;z-index:20;background:rgba(22,50,63,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px}
.freeze b{font-size:40px;font-weight:400}
.freeze p{margin:6px 0 0;font-size:20px;max-width:24em;line-height:1.7}
.freeze .cd{margin-top:8px;font-size:30px;color:var(--sun);font-variant-numeric:tabular-nums}
.toast{position:absolute;z-index:15;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--ok);color:#fff;border-radius:18px;padding:10px 22px;font-size:28px;white-space:nowrap;animation:pop .4s}
.donecard{position:absolute;inset:0;z-index:18;background:rgba(255,250,240,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.donecard .big{font-size:44px;color:var(--tc)}
.donecard .st{font-size:20px}

/* setup + result overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(12,52,68,.75);display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding-top:calc(12px + env(safe-area-inset-top, 0px));padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px))}
.box{background:var(--paper);border-radius:24px;max-width:860px;width:100%;padding:20px 24px 22px;box-shadow:0 10px 0 rgba(0,0,0,.2);margin:auto;touch-action:auto;-webkit-user-select:text;user-select:text}
.box h2{margin:0 0 4px;font-weight:400;font-size:34px;color:var(--red-deep)}
.box .lead{margin:0 0 12px;font-size:18px;line-height:1.8;color:var(--soft)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:16px;color:var(--soft)}
.names input{font:inherit;font-size:22px;border:3px solid #e3d6ba;border-radius:12px;padding:4px 12px;color:var(--ink);background:#fff;min-width:0}
.names .r input{border-color:var(--red)} .names .b input{border-color:var(--blue)}
.mlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.mchk{display:flex;gap:8px;align-items:center;border:3px solid #e3d6ba;border-radius:14px;padding:6px 10px;background:#fff;font-size:18px;cursor:pointer}
.mchk input{width:22px;height:22px;flex:none}
.mchk .k{font-size:14px;color:var(--soft);display:block}
.opts{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-bottom:14px;font-size:17px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts input{width:20px;height:20px}
.go{width:100%;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:28px;padding:10px;box-shadow:0 5px 0 var(--red-deep)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-deep)}
.how{margin:12px 0 0;font-size:15px;color:var(--soft);line-height:1.8}
.count{position:fixed;inset:0;z-index:70;display:grid;place-items:center;font-size:180px;color:#fff;text-shadow:0 8px 0 var(--sea-deep);pointer-events:none}
.count span{animation:pop .5s}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}
.res div{border-radius:16px;padding:12px;text-align:center;font-size:19px;line-height:1.8}
.res .r{background:var(--red-soft)} .res .b{background:var(--blue-soft)}
.res .w{font-size:30px}

@media (max-width:820px){
  body{overflow:auto;touch-action:auto}
  html,body{height:auto}
  .arena{grid-template-columns:1fr}
  .patient{min-height:220px}
  .mlist{grid-template-columns:1fr 1fr}
  .bar h1{font-size:20px}
}
@media (max-width:480px){.names,.mlist,.res{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</div>

  </div>
</div>

<div class="ov" id="result" hidden>

/* sound */
let ac=null;
function tone(fs,d){ if(!opts.sound) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  fs.forEach((f,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle'; o.frequency.value=f; const t=ac.currentTime+i*d;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02); }); }catch(e){} }
const sOk=()=>tone([660,880],.1), sNo=()=>tone([220,160],.18), sDone=()=>tone([523,659,784],.12), sWin=()=>tone([523,659,784,1047,1319],.13), sTick=()=>tone([440],.06);

/* ---------- setup screen ---------- */
$('#mlist').innerHTML = MISSIONS.map(m=>'<label class="mchk"><input type="checkbox" value="'+m.id+'" checked><span>'+esc(m.t)+'<span class="k">'+m.steps.map(s=>s.k).join('、')+'</span></span></label>').join('');

function openSetup(){ stop(); $('#result').hidden = true; $('#setup').hidden = false; }
$('#menuBtn').addEventListener('click', openSetup);
$('#startBtn').addEventListener('click', ()=>{
  const ids = [...document.querySelectorAll('#mlist input:checked')].map(x=>x.value);
  if(!ids.length){ $('#mlist').classList.remove('shake'); void $('#mlist').offsetWidth; $('#mlist').classList.add('shake'); return; }
  opts.hint = $('#optHint').checked; opts.sound = $('#optSound').checked; opts.shuffle = $('#optShuffle').checked;
  plan = MISSIONS.filter(m=>ids.includes(m.id));
  if(opts.shuffle) plan = shuffle(plan);
  $('#setup').hidden = true;
  countdown(begin);
});
$('#againBtn').addEventListener('click', ()=>{ $('#result').hidden = true; countdown(begin); });
$('#fsBtn').addEventListener('click', ()=>{
  try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
});

function countdown(fn){
  const c = document.createElement('div'); c.className='count'; document.body.appendChild(c);
  let n = 3;
  const step = ()=>{ if(n===0){ c.innerHTML='<span>開始！</span>'; tone([880,1175],.12); setTimeout(()=>{ c.remove(); fn(); },600); return; }
    c.innerHTML='<span>'+n+'</span>'; sTick(); n--; setTimeout(step,800); };
  step();
}

/* ---------- game ---------- */
function begin(){
  ['R','B'].forEach(side=>{
    const name = ($('#name'+side).value.trim() || (side==='R'?'紅隊':'藍隊'));
    teams[side] = {side, name, el:$('#team'+side), mi:0, si:0, miss:0, freezeUntil:0, done:false, finishAt:0, hold:null, rub:null};
    renderTeam(teams[side]);
  });
  running = true; startAt = performance.now();
  clearInterval(timer); timer = setInterval(tickClock, 250); tickClock();
}
function stop(){ running=false; clearInterval(timer); }
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function tickClock(){ if(running) $('#clock').textContent = fmt(performance.now()-startAt); }

function renderTeam(T){
  const m = plan[T.mi];
  const prog = plan.map((_,i)=>'<i class="'+(i<T.mi||T.done?'done':(i===T.mi?'now':''))+'"></i>').join('');
  if(T.done){
    T.el.innerHTML = head(T,prog)+'<div class="donecard"><div class="big">任務全部完成！</div><div class="st">用時 '+fmt(T.finishAt-startAt)+'　拿錯 '+T.miss+' 次</div></div>';
    return;
  }
  const items = shuffle(m.steps.map(s=>s.it).concat(m.bad));
  T.el.innerHTML = head(T,prog)+
    '<div class="mission"><span class="mt">任務 '+(T.mi+1)+'：'+esc(m.t)+'</span><div class="steps">'+m.steps.map((s,i)=>'<span class="step'+(i===0?' now':'')+'">'+esc(s.k)+'</span>').join('')+'</div><div class="hint"></div></div>'+
    '<div class="patient">'+bodySVG(m.part,m.mark)+'<div class="stickers"></div><span class="plabel">'+esc(m.plabel)+'</span></div>'+
    '<div class="tray">'+items.map(id=>{ const it=ITEMS[id]; return '<div class="tok'+(it.t?' big':'')+'" data-id="'+id+'"><span class="ic">'+icon(it)+'</span><span class="lb">'+esc(it.l)+'</span></div>'; }).join('')+'</div>';
  T.si = 0; T.hold = null; T.rub = null;
  updHint(T);
  T.el.querySelectorAll('.tok').forEach(tok=>bindDrag(T,tok));
  bindRub(T);
}
function head(T,prog){ return '<div class="thead"><span class="nm">'+esc(T.name)+'</span><span class="miss">拿錯 '+T.miss+'</span><span class="prog">'+prog+'</span></div>'; }
function updHint(T){
  const m = plan[T.mi], s = m.steps[T.si];
  T.el.querySelectorAll('.step').forEach((e,i)=>{ e.className='step'+(i<T.si?' done':(i===T.si?' now':'')); });
  T.el.querySelector('.hint').textContent = opts.hint && s ? s.h : (s ? '下一步：「'+s.k+'」' : '');
}
function cur(T){ return plan[T.mi].steps[T.si]; }
function frozen(T){ return performance.now() < T.freezeUntil; }

function hitPatient(T,x,y){ const r=T.el.querySelector('.patient').getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }

function bindDrag(T,tok){
  tok.addEventListener('pointerdown', e=>{
    if(!running || T.done || T.lock || frozen(T) || T.rub) return;
    e.preventDefault();
    try{ tok.setPointerCapture(e.pointerId); }catch(_){}
    const ghost = tok.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = tok.offsetWidth+'px';
    document.body.appendChild(ghost);
    const move = (x,y)=>{ ghost.style.left=x+'px'; ghost.style.top=y+'px'; };
    move(e.clientX,e.clientY);
    tok.style.opacity = '.35';
    const id = tok.dataset.id;
    const pat = T.el.querySelector('.patient');
    let over = false, lx=e.clientX, ly=e.clientY;
    const onMove = ev=>{ if(ev.pointerId!==e.pointerId) return; lx=ev.clientX; ly=ev.clientY; move(lx,ly);
      over = hitPatient(T,lx,ly); pat.classList.toggle('hot', over);
      const s = cur(T);
      if(s && s.mode==='hold' && s.it===id){
        if(over && !T.hold){ T.hold = {t0:performance.now(), id}; holdLoop(T, s); }
        else if(!over && T.hold){ T.hold=null; clearRing(T); }
      }
    };
    const end = ev=>{ if(ev.pointerId!==e.pointerId) return;
      tok.removeEventListener('pointermove',onMove); tok.removeEventListener('pointerup',end); tok.removeEventListener('pointercancel',end);
      ghost.remove(); tok.style.opacity=''; pat.classList.remove('hot');
      const s = cur(T);
      if(T.hold && T.hold.id===id){ T.hold=null; clearRing(T); return; }   // released too early: no penalty
      if(ev.type==='pointercancel' || !hitPatient(T,lx,ly) || !s) return;
      if(T._justDone===id){ T._justDone=null; return; }
      if(id!==s.it){ wrong(T,id); return; }
      if(s.mode==='hold'){ flashRing(T,'要按住不放 '+s.n+' 秒喔！'); return; }
      if(s.mode==='rub'){ tok.classList.add('used'); startRub(T,s); return; }
      tok.classList.add('used'); stepDone(T);
    };
    tok.addEventListener('pointermove',onMove); tok.addEventListener('pointerup',end); tok.addEventListener('pointercancel',end);
  });
}
function holdLoop(T,s){
  const tick = ()=>{
    if(!T.hold || !running) return;
    const sec = (performance.now()-T.hold.t0)/1000;
    showRing(T, s.k+'…… <b>'+Math.min(sec,s.n).toFixed(1)+'</b> / '+s.n+' 秒');
    if(sec>=s.n){ const id=T.hold.id; T.hold=null; clearRing(T); T._justDone=id;
      const tok=T.el.querySelector('.tok[data-id="'+id+'"]'); if(tok) tok.classList.add('used'); stepDone(T); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function showRing(T,html){ let r=T.el.querySelector('.ring'); if(!r){ r=document.createElement('div'); r.className='ring'; T.el.querySelector('.patient').appendChild(r);} r.innerHTML=html; }
function clearRing(T){ const r=T.el.querySelector('.ring'); if(r) r.remove(); }
function flashRing(T,msg){ showRing(T,msg); sNo(); setTimeout(()=>clearRing(T),1400); }

function startRub(T,s){
  T.rub = {n:0, need:s.n, dir:0, lastX:null, acc:0};
  const p = T.el.querySelector('.patient');
  const b = document.createElement('div'); b.className='rubbar'; p.appendChild(b);
  updRub(T);
}
function updRub(T){ const b=T.el.querySelector('.rubbar'); if(b) b.textContent='在傷患身上來回摩擦！ '+T.rub.n+' / '+T.rub.need; }
function bindRub(T){
  const p = T.el.querySelector('.patient');
  p.addEventListener('pointerdown', e=>{ if(!T.rub) return; e.preventDefault(); try{p.setPointerCapture(e.pointerId);}catch(_){} T.rub.lastX=e.clientX; T.rub.dir=0; T.rub.acc=0; });
  p.addEventListener('pointermove', e=>{
    const R=T.rub; if(!R || R.lastX===null || !running) return;
    const dx = e.clientX - R.lastX; R.lastX = e.clientX;
    const d = Math.sign(dx); if(!d) return;
    if(d===R.dir){ R.acc += Math.abs(dx); }
    else { if(R.acc>40 && R.dir!==0){ R.n++; sTick(); updRub(T); addSticker(T, cur(T).st, true); if(R.n>=R.need){ T.rub=null; const b=T.el.querySelector('.rubbar'); if(b) b.remove(); stepDone(T); return; } } R.dir=d; R.acc=Math.abs(dx); }
  });
  const up = ()=>{ if(T.rub) T.rub.lastX=null; };
  p.addEventListener('pointerup', up); p.addEventListener('pointercancel', up);
}
function addSticker(T, st, small){
  const box = T.el.querySelector('.stickers'); if(!box) return;
  const sp = document.createElement('span');
  sp.innerHTML = stIcon(st);
  sp.style.left = (18+Math.random()*58)+'%'; sp.style.top = (14+Math.random()*58)+'%';
  if(small) sp.style.transform='scale(.6)';
  box.appendChild(sp);
}
function stepDone(T){
  const m = plan[T.mi], s = cur(T);
  addSticker(T, s.st);
  sOk(); T.si++;
  if(T.si >= m.steps.length){
    sDone();
    const t = document.createElement('div'); t.className='toast'; t.textContent = m.t+' 完成！'; T.el.appendChild(t);
    T.lock = true;
    setTimeout(()=>{ T.lock=false; T.mi++; if(T.mi>=plan.length){ T.done=true; T.finishAt=performance.now(); renderTeam(T); checkEnd(); } else renderTeam(T); }, 1100);
    return;
  }
  updHint(T);
}
function wrong(T,id){
  T.miss++; sNo();
  const s = cur(T), it = ITEMS[id];
  const later = plan[T.mi].steps.findIndex(x=>x.it===id) > T.si;
  const why = later ? '「'+it.l+'」是後面的步驟，順序不對！' : '「'+it.l+'」不能這樣用喔！';
  T.freezeUntil = performance.now()+3000;
  T.el.querySelector('.miss').textContent = '拿錯 '+T.miss;
  const f = document.createElement('div'); f.className='freeze';
  f.innerHTML = '<b>冷靜一下！</b><p>'+esc(why)+'</p><div class="cd">3</div>';
  T.el.appendChild(f);
  const tok = T.el.querySelector('.tok[data-id="'+id+'"]'); if(tok){ tok.classList.remove('shake'); void tok.offsetWidth; tok.classList.add('shake'); }
  let n=3; const iv=setInterval(()=>{ n--; const cd=f.querySelector('.cd'); if(cd) cd.textContent=n; if(n<=0){ clearInterval(iv); f.remove(); } },1000);
}
function checkEnd(){
  const R=teams.R, B=teams.B;
  if(!(R.done && B.done)){
    // first team finished: announce, let the other team keep going
    const first = R.done && !B.done ? R : (B.done && !R.done ? B : null);
    if(first && !first.announced){ first.announced=true; sWin(); }
    return;
  }
  stop();
  const winner = R.finishAt < B.finishAt ? R : B;
  $('#resTitle').textContent = winner.name+' 獲勝！';
  $('#resBody').innerHTML = [R,B].map(T=>'<div class="'+(T.side==='R'?'r':'b')+'"><div class="w">'+esc(T.name)+(T===winner?' 🏆':'')+'</div>用時 '+fmt(T.finishAt-startAt)+'<br>拿錯 '+T.miss+' 次</div>').join('');
  setTimeout(()=>{ $('#result').hidden=false; sWin(); }, 900);
}

/* idle preview behind setup */
plan = MISSIONS.slice(0,1);
['R','B'].forEach(side=>{ teams[side]={side,name:side==='R'?'紅隊':'藍隊',el:$('#team'+side),mi:0,si:0,miss:0,freezeUntil:0,done:false}; renderTeam(teams[side]); });
})();
</script>
